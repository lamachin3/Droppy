services:
  backend:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    command: /start
    volumes:
      - ./dropper_core:/app/dropper_core
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - yara_rules:/app/api/analysis/services/yara_rules/rules
    env_file:
      - ./backend/.env.prod
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - droppy_network
    restart: unless-stopped

  frontend:
    build:
      context: ./droppy-ui
      dockerfile: ../compose/production/frontend/Dockerfile
    volumes:
      - frontend_build:/app/dist
    env_file:
      - ./droppy-ui/.env
    expose:
      - "80"
    networks:
      - droppy_network
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${SQL_DATABASE}
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
    networks:
      - droppy_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./compose/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./compose/nginx/ssl:/etc/nginx/ssl
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - frontend_build:/app/frontend
    depends_on:
      - backend
      - frontend
    networks:
      - droppy_network
    restart: unless-stopped

networks:
  droppy_network:
    driver: bridge

volumes:
  postgres_data:
  backend_static:
  backend_media:
  yara_rules:
  frontend_build:
