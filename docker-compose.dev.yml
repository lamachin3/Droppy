services:
  backend:
    build:
      context: .
      dockerfile: ./compose/dev/django/Dockerfile.dev
    volumes:
      - ./backend:/app/backend
      - ./dropper_core:/app/dropper_core
      - backend_static:/app/backend/staticfiles
      - backend_media:/app/backend/media
      - yara_rules:/app/backend/api/analysis/services/yara_rules/rules
    env_file:
      - ./backend/.env.dev
    ports:
      - "8000:8000"
    networks:
      - droppy_network

  frontend:
    build:
      context: .
      dockerfile: ./compose/dev/frontend/Dockerfile.dev
    working_dir: /app
    volumes:
      - ./droppy-ui:/app:cached
      - /app/node_modules
    env_file:
      - ./droppy-ui/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - droppy_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./compose/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - backend_static:/app/backend/staticfiles
      - backend_media:/app/backend/media
    depends_on:
      - backend
      - frontend
    networks:
      - droppy_network

networks:
  droppy_network:
    driver: bridge

volumes:
  postgres_data:
  backend_static:
  backend_media:
  yara_rules:
